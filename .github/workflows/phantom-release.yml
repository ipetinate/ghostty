name: Phantom Release

# The fork's release pipeline. Ghostty's release-tag.yml is gone from this
# repo: it used infrastructure this fork has no access to (paid Namespace
# runners, Nix, a real Developer ID cert, R2).
# This builds, ad-hoc signs, packages and publishes two DMGs to this repo's
# own Releases page on every push to main — a universal Phantom.dmg and the
# Apple-Silicon-only Phantom-arm64.dmg thinned from it — each with the Sparkle
# appcast that build updates itself from, so the Releases page is the whole of
# the update infrastructure.
on:
  push:
    branches: [main]
    # A push that only touches the site or the two root documents is not a
    # release. Without this the job reaches the version step, finds the tag
    # already exists and fails on purpose — a red main for a documentation
    # commit. paths-ignore skips only when *every* changed file matches, so a
    # real release still runs.
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "FEATURES.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: git rev-list --count and git tag -l both need it.
          fetch-depth: 0

      # The version comes from build.zig.zon, never from arithmetic over
      # existing tags.
      #
      # It used to take the highest `v*.*.*` and add one, which quietly
      # counted **Ghostty's** tags — this fork inherited v1.3.2 through
      # v1.3.4 — and so tagged our own merge v1.3.5 while build.zig.zon
      # still said 1.3.2-dev. The build refuses a tag that disagrees with
      # that file ("tagged releases must be in vX.Y.Z format matching
      # build.zig"), so main became unbuildable for anyone whose HEAD
      # landed on the tag. Reading the one file that declares the version
      # makes the two unable to drift.
      - name: Compute version
        id: version
        run: |
          DECLARED=$(grep -m1 '\.version' build.zig.zon | sed -E 's/.*"([^"]+)".*/\1/')

          # Any pre-release suffix is dropped for the tag, not just "-dev".
          # The suffix says how finished the build is — "-dev" while it is
          # being worked on, "-beta" once it is usable but still taking
          # fixes, nothing at all when it is stable — and the tag cannot
          # carry it: the Zig build refuses a tag that is not vX.Y.Z
          # matching build.zig. So the tag is the number and the release
          # *title* is what was declared, which is also what stops anyone
          # renaming releases by hand afterwards.
          VERSION=${DECLARED%%-*}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "build.zig.zon version '$DECLARED' is not X.Y.Z with an optional suffix" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already exists — bump .version in build.zig.zon" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=v${DECLARED}" >> "$GITHUB_OUTPUT"
          echo "short_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Set version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.short_version }}" zig-out/Phantom.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build }}" zig-out/Phantom.app/Contents/Info.plist

      - name: Codesign (ad-hoc)
        run: |
          codesign --force --deep --sign - \
            --entitlements macos/GhosttyReleaseLocal.entitlements \
            zig-out/Phantom.app

      - name: Create DMG
        run: |
          npm install --global create-dmg
          # create-dmg's exit code isn't reliable even on success; the real
          # check is whether the file landed.
          create-dmg zig-out/Phantom.app . || true
          mv Phantom*.dmg Phantom.dmg
          test -f Phantom.dmg

      - name: Thin a copy of the app to Apple Silicon
        run: |
          set -euo pipefail
          rm -rf arm64
          mkdir arm64
          ditto zig-out/Phantom.app arm64/Phantom.app
          thinned=0
          while IFS= read -r -d '' file; do
            archs=$(lipo -archs "$file" 2>/dev/null) || continue
            case "$archs" in *x86_64*) ;; *) continue ;; esac
            case "$archs" in *arm64*) ;; *) continue ;; esac
            lipo -thin arm64 "$file" -output "$file.thin"
            cat "$file.thin" > "$file"
            rm -f "$file.thin"
            thinned=$((thinned + 1))
          done < <(find arm64/Phantom.app -type f -print0)
          if [ "$thinned" -eq 0 ]; then
            echo "::error::nothing in the bundle was universal — the two DMGs would carry the same binaries" >&2
            exit 1
          fi
          echo "thinned ${thinned} binaries"
          codesign --force --deep --sign - \
            --entitlements macos/GhosttyReleaseLocal.entitlements \
            arm64/Phantom.app
          codesign --verify --deep --strict arm64/Phantom.app

      - name: Create Apple Silicon DMG
        run: |
          set -euo pipefail
          mkdir -p dmg-arm64
          create-dmg arm64/Phantom.app dmg-arm64 || true
          mv dmg-arm64/Phantom*.dmg Phantom-arm64.dmg
          test -f Phantom-arm64.dmg

      # The tools come from Sparkle's own release, pinned and checksummed like
      # every action in this file: the signature they produce is the one the
      # Sparkle framework inside the app verifies, and a tool that is not the
      # framework's own is a second implementation of the same contract.
      #
      # This version is the one the app links (Package.resolved). Raising it
      # here without raising it there is the drift this comment exists to
      # stop.
      - name: Sparkle tools
        env:
          SPARKLE_VERSION: "2.9.6"
          SPARKLE_SHA256: "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  /tmp/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/sparkle
          tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle
          echo "/tmp/sparkle/bin" >> "$GITHUB_PATH"

      # The private key never touches the checkout: it is read from the secret
      # on standard input, which is the form sign_update documents for CI. An
      # unsigned DMG is refused before it can be published, because an item
      # the app cannot verify is worse than no item — every reader would see a
      # bad-signature error instead of an update.
      #
      # The previous feed is fetched so history survives: a reader several
      # versions behind still finds an entry. A missing feed (the first
      # release) starts a new one, and only that case is allowed to fail.
      - name: Sign and generate appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PHANTOM_VERSION: ${{ steps.version.outputs.short_version }}
          PHANTOM_BUILD: ${{ steps.version.outputs.build }}
          PHANTOM_TAG: ${{ steps.version.outputs.tag }}
          PHANTOM_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — the DMGs cannot be signed, so no update can be published" >&2
            exit 1
          fi
          export PHANTOM_COMMIT="${PHANTOM_COMMIT:0:9}"
          for entry in "Universal|Phantom.dmg|appcast.xml" "Apple Silicon|Phantom-arm64.dmg|appcast-arm64.xml"; do
            IFS='|' read -r flavor dmg feed <<< "$entry"
            signature="${feed%.xml}.sig.txt"
            echo "${SPARKLE_PRIVATE_KEY}" | sign_update --ed-key-file - "$dmg" > "$signature"
            cat "$signature"
            curl -sSfL -o "$feed" \
              "https://github.com/ipetinate/phantom/releases/latest/download/${feed}" \
              || { echo "no previous ${feed} — starting a new feed"; : > "$feed"; }
            PHANTOM_FLAVOR="$flavor" \
            PHANTOM_DMG="$dmg" \
            PHANTOM_APPCAST="$feed" \
            PHANTOM_SIGNATURE="$signature" \
              python3 ./dist/macos/phantom_appcast.py
            xmllint --noout "$feed"
          done

      - name: Tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.title }}" \
            --generate-notes \
            --notes 'Take **Phantom.dmg** to run on any Mac, or **Phantom-arm64.dmg** for an Apple Silicon build at half the size — the two carry the same code, and each keeps updating within its own flavour. Ad-hoc signed, not notarized — on first launch, right-click the app and choose **Open** (or run `xattr -cr Phantom.app` after unzipping) instead of double-clicking, or Gatekeeper will refuse it as from an unidentified developer. Later versions arrive through Phantom > Check for Updates.' \
            Phantom.dmg Phantom-arm64.dmg appcast.xml appcast-arm64.xml
